# Seguridad automatica de un repo (workflow reutilizable de la org).
#
# QUE HACE
#   - CodeQL para Java (none) y Kotlin (autobuild), con consultas de seguridad y calidad.
#   - dependency-review en PRs: bloquea dependencias nuevas con vulnerabilidades altas.
#   - gitleaks sobre todo el historial: avisa de secretos subidos por error.
#
# POR QUE EXISTE
#   La auditoria de CI (2026-10-14) encontro 0 workflows con analisis de seguridad en 139 repos con codigo,
#   y varios jobs publican con MODRINTH_TOKEN. Esto es barato (gratis en repos publicos) y automatico.
name: Seguridad (reutilizable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    # un fallo de infraestructura de CodeQL (p. ej. finalizar la base de datos de un build Gradle raro) no debe poner rojo el repo
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Helpers para compilar Kotlin
        if: ${{ hashFiles('**/*.kt') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SlimefunNewHorizons/.github
          path: _org
      - name: Detectar Java para Kotlin
        if: ${{ hashFiles('**/*.kt') != '' }}
        id: jv
        run: echo "version=$(python3 _org/.github/scripts/detectar-java.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: ${{ hashFiles('**/*.kt') != '' }}
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.version }}
      - name: Dependencias de la org para Kotlin
        if: ${{ hashFiles('**/*.kt') != '' }}
        run: bash _org/.github/scripts/bootstrap-maven-repo.sh
      - name: Memoria acotada para la extraccion de Kotlin
        if: ${{ hashFiles('**/*.kt') != '' && hashFiles('**/gradlew') != '' }}
        run: |
          # La instrumentacion de CodeQL necesita mas heap que el build normal.
          # Configuracion efimera del runner; no modifica el repositorio analizado.
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: java-kotlin
          build-mode: ${{ hashFiles('**/*.kt') != '' && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: /language:java-kotlin

  dependencias:
    name: Revision de dependencias (solo PR)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  secretos:
    name: gitleaks (secretos en el historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Ejecutar gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  trailers:
    name: Sin trailers de IA en los commits nuevos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 50
      - name: 'Buscar Co-Authored-By de IA (regla de Jack, jamas)'
        run: |
          set -euo pipefail
          RANGE=""
          BEFORE="${{ github.event.before }}"
          BASE_REF="${{ github.base_ref }}"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
              RANGE="origin/$BASE_REF..HEAD"
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
              RANGE="$BEFORE..HEAD"
            fi
          fi

          if [ -n "$RANGE" ]; then
            echo "Comprobando trailers en rango: $RANGE"
            COMMITS=$(git log "$RANGE" --format=%B)
          else
            echo "Comprobando trailers en commit HEAD"
            COMMITS=$(git log -n 1 --format=%B)
          fi

          if echo "$COMMITS" | grep -iE '^Co-Authored-By:.*(claude|anthropic|codex|openai|copilot|gemini|noreply@anthropic)' ; then
            echo "::error::Hay un trailer Co-Authored-By de IA en los commits. Reescribe el commit sin el trailer."
            exit 1
          fi
