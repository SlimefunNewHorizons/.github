name: Pruebas de helpers CI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/server-smoke-test.sh'
      - '.github/scripts/test_server_smoke_test.py'
      - '.github/workflows/ci-helpers.yml'
  pull_request:
    paths:
      - '.github/scripts/server-smoke-test.sh'
      - '.github/scripts/test_server_smoke_test.py'
      - '.github/workflows/ci-helpers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash -n .github/scripts/server-smoke-test.sh
      - run: python3 -m unittest discover -s .github/scripts -p test_server_smoke_test.py -v
