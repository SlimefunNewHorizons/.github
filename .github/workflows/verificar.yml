# Verificacion obligatoria de un addon/plugin (workflow reutilizable de la org).
#
# QUE HACE
#   Compila con Maven o Gradle y EJECUTA LOS TESTS (sin -DskipTests), sube el jar como artefacto y el informe de
#   tests. Si el repo hereda del parent drakes-slimefun-labs, prepara antes el repositorio Maven de la org.
#
# POR QUE EXISTE
#   Antes `drake-ci.yml` hacia `exit 0` cuando el pom heredaba de drakes-slimefun-labs ("se omite el build") y
#   `modrinth-publish.yml` compilaba con -DskipTests: un cambio podia llegar a main y publicarse sin que se
#   compilara ni se probara nada. Chagui68 resolvio esto en MultiverseCreatures con `verify.yml` ("el job que
#   convierte los tests en una garantia real"); aqui se generaliza a todos los repos.
#
# COMO SE USA (en cada repo):
#   jobs:
#     verificar:
#       uses: SlimefunNewHorizons/.github/.github/workflows/verificar.yml@main
name: Verificar (reutilizable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Version de Java para compilar ("auto" la detecta del pom/gradle, 21 a 25)'
        type: string
        default: 'auto'
      maven-args:
        description: 'Argumentos extra de Maven'
        type: string
        default: ''
    outputs:
      jar-name:
        description: 'Nombre del jar generado'
        value: ${{ jobs.verificar.outputs.jar-name }}

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y testear
    runs-on: ubuntu-latest
    outputs:
      jar-name: ${{ steps.jar.outputs.nombre }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scripts compartidos de la org
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SlimefunNewHorizons/.github
          path: _org
      - name: Aviso - CI omitido por decision del repo
        if: ${{ hashFiles('.github/ci-skip') != '' }}
        run: |
          echo "::notice title=CI omitido::$(cat .github/ci-skip)"
          echo "### CI omitido" >> "$GITHUB_STEP_SUMMARY"; cat .github/ci-skip >> "$GITHUB_STEP_SUMMARY"
      - name: Detectar la version de Java necesaria
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        id: jv
        run: |
          if [ "${{ inputs.java-version }}" = "auto" ]; then V="$(python3 _org/.github/scripts/detectar-java.py)"; else V="${{ inputs.java-version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "Java $V"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || (hashFiles('**/*.gradle*') != '' && 'gradle' || '') }}

      - name: Preparar el repositorio Maven de la org (falla si no se puede)
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        run: bash _org/.github/scripts/bootstrap-maven-repo.sh

      - name: Compilar y ejecutar los tests
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        env:
          # Algunos repos Gradle leen paquetes publicos de GitHub Packages y exigen credenciales (USERNAME/PASSWORD).
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then
            mvn -B -ntp verify ${{ inputs.maven-args }}
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif ls build.gradle* >/dev/null 2>&1; then
            gradle build --no-daemon
          else
            echo "::error::No se encontro pom.xml ni build.gradle"; exit 1
          fi

      - name: Localizar los jars (repos de un modulo o reactores multi-modulo)
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        id: jar
        run: |
          set -euo pipefail
          mkdir -p dist
          # todos los jars de salida (en reactores cada modulo tiene su target/), sin los intermedios
          while IFS= read -r f; do
            cp "$f" dist/
          done < <( { find . -type f \( -path '*/target/*.jar' -o -path '*/build/libs/*.jar' \)                       ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-tests.jar'                       ! -name '*-plain.jar' ! -path './_org/*' ! -path '*/node_modules/*' 2>/dev/null || true; } | sort)
          N="$(ls dist/*.jar 2>/dev/null | wc -l)"
          if [ "$N" = 0 ]; then echo "::error::No se genero ningun jar"; exit 1; fi
          echo "Jars: $N"; ls dist
          echo "nombre=$(basename "$(ls dist/*.jar | head -n1)")" >> "$GITHUB_OUTPUT"

      - name: Guardar el jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ hashFiles('.github/ci-skip') == '' }}
        with:
          name: plugin-jar
          path: dist/*.jar
          retention-days: 14

      - name: Guardar el informe de tests
        if: ${{ (always()) && hashFiles('.github/ci-skip') == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: informe-tests
          path: |
            target/surefire-reports/
            build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
